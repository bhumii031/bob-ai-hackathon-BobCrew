# IBM Bob AI Hackathon - Submission Metadata
# Team: BobCrew

project:
  title: "Sentinel — Drug Safety & Regulatory Intelligence Platform"
  tagline: "Automated pharmacovigilance signal detection and ICH M4 CTD submission gap analysis — zero backend, fully client-side."
  track: "AI / Healthcare & Life Sciences"
  version: "1.0.0"

team:
  name: "BobCrew"
  repository: "https://github.com/bhumii031/bob-ai-hackathon-BobCrew"

problem_statement: >
  Pharmacovigilance teams must manually sift through thousands of spontaneous adverse
  event reports to detect drug safety signals — a slow, error-prone process requiring
  specialist statistical expertise. Regulatory dossier managers preparing NDA/MAA
  submissions also struggle to cross-check documents against the ICH M4 CTD structure
  by hand, frequently missing critical gaps that lead to costly regulatory rejections.

solution: >
  Sentinel is a fully client-side React web application that automates both challenges
  in one unified dashboard. It runs validated disproportionality algorithms (PRR, ROR,
  Chi-square with Yates correction, 95% CI) directly in the browser to surface drug-event
  safety signals in seconds. It also performs Levenshtein fuzzy-match gap analysis of a
  dossier TOC against the complete ICH M4 CTD reference structure, scoring readiness
  per module and flagging Critical/High/Medium severity gaps before submission.

key_features:
  - "Automated Signal Detection: PRR, ROR, Chi-square (Yates), 95% CI — ranks signals Critical / Signal / Watch / No Signal"
  - "CSV Upload & Validation: accepts up to 50,000 AE rows with column validation and clear error messages"
  - "ICH M4 CTD Gap Analysis: Levenshtein fuzzy matching against 60-item CTD reference with per-module readiness scores"
  - "Interactive Visualisations: scatter plots, trend charts, bar charts, animated SVG readiness gauge (Recharts)"
  - "Dark Mode + Responsive UI: full dark/light toggle, custom Tailwind sidebar navigation"
  - "Zero Backend / Privacy-First: all computation runs in-browser, no data leaves the user machine"

