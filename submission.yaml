repository_structure:
  src: "All React source code — components, utils, data"
  docs: "Written documentation including setup-guide.md"
  demo: "Screenshots, demo video link, live demo URL"
  presentation: "Slide deck (slides.pdf)"

how_to_run:
  prerequisites:
    - "Node.js 18+"
    - "npm 9+"
  steps:
    - "git clone https://github.com/bhumii031/bob-ai-hackathon-BobCrew.git"
    - "cd bob-ai-hackathon-BobCrew"
    - "npm install"
    - "npm run dev   # opens at http://localhost:5173"
  notes: "No .env required. App is fully client-side with built-in sample data."

demo:
  demo_video: "demo/demo-video-link.txt"
  live_demo: "demo/live-demo-url.txt"
  screenshots: "demo/screenshots/"
  presentation: "presentation/slides.pdf"

known_limitations:
  - "No user authentication — single-user browser tool, not production-hardened"
  - "CSV files capped at 50,000 rows to maintain browser responsiveness"
  - "JS bundle ~644 KB (uncompressed) — code-splitting not applied in this version"
  - "CTD gap detection uses Levenshtein fuzzy matching, not NLP"
  - "No persistent storage — data resets on page refresh"

most_proud_of: >
  End-to-end pharmacovigilance math (PRR, ROR, Chi-square, 95% CI) implemented in pure
  JavaScript with no external stats library, combined with a zero-backend privacy-first
  architecture and a production-quality UI — all built entirely using IBM Bob Agent Mode
  in a hackathon timeframe.

ibm_bob_usage: >
  Every component, algorithm, utility function, and CSS class in this project was written
  by IBM Bob in Agent Mode. The project demonstrates IBM Bob's capability to produce
  domain-expert-level code for specialised life sciences and regulatory applications,
